{{ define "main" }}
  {{ partial "nav.html" . }}
  <main class="container">
    <style>
      .page-content {
        padding-top: var(--space-24);
        padding-bottom: var(--space-16);
        max-width: var(--max-width-prose);
        margin: 0 auto;
      }
      .page-header {
        margin-bottom: var(--space-10);
        padding-bottom: var(--space-6);
        border-bottom: 1px solid var(--color-border);
      }
      .page-title {
        font-family: var(--font-mono);
        font-size: var(--font-size-3xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-primary);
      }
      .page-title-prompt {
        color: var(--color-accent);
        font-weight: var(--font-weight-normal);
      }
      .page-body p {
        color: var(--color-text-secondary);
        line-height: var(--line-height-relaxed);
        margin-bottom: var(--space-6);
      }
      .page-body h2 {
        font-family: var(--font-mono);
        margin-top: var(--space-10);
        margin-bottom: var(--space-4);
      }
      .page-body h3 {
        font-family: var(--font-mono);
        margin-top: var(--space-8);
        margin-bottom: var(--space-3);
      }
      .page-body a {
        color: var(--color-accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .page-newsletter-embed {
        margin-top: var(--space-10);
      }
      @media (max-width: 768px) {
        .page-title {
          font-size: var(--font-size-2xl);
        }
      }
    </style>
    <article class="page-content">
      <header class="page-header">
        <h1 class="page-title">
          <span class="page-title-prompt">&gt;_</span> {{ .Title }}
        </h1>
      </header>

      <div class="page-body prose">
        {{ .Content }}
      </div>

      {{/* Newsletter page — render beehiiv embed */}}
      {{ if in (lower .Title) "newsletter" }}
        {{ with .Site.Params.beehiivUrl }}
          <div class="page-newsletter-embed">
            <iframe src="{{ . }}" width="100%" height="320" frameborder="0" scrolling="no" style="border-radius: var(--radius-md); border: 1px solid var(--color-border); background: transparent;"></iframe>
          </div>
        {{ end }}
      {{ end }}
    </article>
  </main>
{{ end }}

{{ define "footer" }}
  {{ partial "footer.html" . }}
{{ end }}

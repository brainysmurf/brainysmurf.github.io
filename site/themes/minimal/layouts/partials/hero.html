<style>
  .hero-minimal {
    max-width: var(--max-width-site);
    margin: 0 auto;
    padding: var(--space-16) var(--space-6);
    text-align: center;
  }
  .hero-minimal__name {
    font-size: var(--font-size-4xl);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
    color: var(--color-text-primary);
    margin-bottom: var(--space-3);
  }
  .hero-minimal__role {
    font-family: var(--font-mono);
    font-size: var(--font-size-lg);
    color: var(--color-text-muted);
    margin-bottom: var(--space-6);
  }
  .hero-minimal__bio {
    font-size: var(--font-size-lg);
    color: var(--color-text-secondary);
    max-width: var(--max-width-prose);
    margin: 0 auto var(--space-8);
    line-height: var(--line-height-relaxed);
  }
  .hero-minimal__ctas {
    display: flex;
    gap: var(--space-4);
    justify-content: center;
    flex-wrap: wrap;
  }
  .hero-minimal__cta {
    display: inline-block;
    padding: var(--space-3) var(--space-6);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    text-decoration: none;
    transition: all var(--transition-fast);
  }
  .hero-minimal__cta--primary {
    background: var(--color-accent);
    color: var(--color-bg);
  }
  .hero-minimal__cta--primary:hover {
    background: var(--color-accent-hover);
    color: var(--color-bg);
  }
  .hero-minimal__cta--secondary {
    border: 1px solid var(--color-border);
    color: var(--color-text-secondary);
  }
  .hero-minimal__cta--secondary:hover {
    border-color: var(--color-text-muted);
    color: var(--color-text-primary);
  }
</style>

<section class="hero-minimal">
  <h1 class="hero-minimal__name">{{ .Site.Params.author }}</h1>
  <p class="hero-minimal__role">{{ .Site.Params.role }}</p>
  <p class="hero-minimal__bio">{{ .Site.Params.description }}</p>
  <div class="hero-minimal__ctas">
    <a href="/posts/" class="hero-minimal__cta hero-minimal__cta--primary">Read Posts</a>
    <a href="/newsletter/" class="hero-minimal__cta hero-minimal__cta--secondary">Newsletter</a>
  </div>
</section>

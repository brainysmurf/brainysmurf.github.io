<style>
  .nav-editorial {
    max-width: var(--max-width-site);
    margin: 0 auto;
    padding: var(--space-5) var(--space-6);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--color-border);
  }
  .nav-editorial__name {
    font-family: var(--font-heading);
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    text-decoration: none;
  }
  .nav-editorial__links {
    display: flex;
    align-items: center;
    gap: var(--space-6);
    list-style: none;
  }
  .nav-editorial__link {
    font-size: var(--font-size-sm);
    color: var(--color-text-secondary);
    text-decoration: none;
    padding-bottom: var(--space-1);
    border-bottom: 2px solid transparent;
    transition: color var(--transition-fast), border-color var(--transition-fast);
  }
  .nav-editorial__link:hover,
  .nav-editorial__link--active {
    color: var(--color-accent);
    border-bottom-color: var(--color-accent);
  }
  .nav-editorial__toggle {
    background: none;
    border: none;
    color: var(--color-text-muted);
    cursor: pointer;
    font-size: var(--font-size-base);
    padding: var(--space-1);
    transition: color var(--transition-fast);
  }
  .nav-editorial__toggle:hover {
    color: var(--color-accent);
  }
  .nav-editorial__hamburger {
    display: none;
    background: none;
    border: none;
    color: var(--color-text-primary);
    cursor: pointer;
    font-size: var(--font-size-xl);
    padding: var(--space-1);
  }
  .nav-editorial__mobile {
    display: none;
    flex-direction: column;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-6);
    max-width: var(--max-width-site);
    margin: 0 auto;
    border-bottom: 1px solid var(--color-border);
  }
  .nav-editorial__mobile.open { display: flex; }
  .nav-editorial__mobile a {
    font-family: var(--font-heading);
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: var(--font-size-lg);
  }
  @media (max-width: 768px) {
    .nav-editorial__links { display: none; }
    .nav-editorial__hamburger { display: block; }
  }
</style>

<nav>
  <div class="nav-editorial">
    <a href="/" class="nav-editorial__name">{{ .Site.Title }}</a>
    <ul class="nav-editorial__links">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" class="nav-editorial__link">{{ .Name }}</a></li>
      {{ end }}
      <li><button class="nav-editorial__toggle" id="theme-toggle" aria-label="Toggle theme">◐</button></li>
    </ul>
    <button class="nav-editorial__hamburger" id="menu-toggle" aria-label="Toggle menu">☰</button>
  </div>
  <div class="nav-editorial__mobile" id="mobile-menu">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
    <button class="nav-editorial__toggle" id="theme-toggle-mobile" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<script>
(function() {
  var saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  function toggleTheme() {
    var c = document.documentElement.getAttribute('data-theme');
    var n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('theme', n);
  }

  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  var mt = document.getElementById('theme-toggle-mobile');
  if (mt) mt.addEventListener('click', toggleTheme);

  document.getElementById('menu-toggle').addEventListener('click', function() {
    document.getElementById('mobile-menu').classList.toggle('open');
  });
})();
</script>

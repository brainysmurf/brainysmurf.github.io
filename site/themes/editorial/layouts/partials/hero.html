<style>
  .hero-editorial {
    max-width: var(--max-width-site);
    margin: 0 auto;
    padding: var(--space-12) var(--space-6) var(--space-10);
    border-bottom: 1px solid var(--color-border);
  }
  .hero-editorial__name {
    font-family: var(--font-heading);
    font-size: var(--font-size-4xl);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
    color: var(--color-text-primary);
    margin-bottom: var(--space-2);
  }
  .hero-editorial__role {
    font-size: var(--font-size-lg);
    color: var(--color-accent);
    font-weight: var(--font-weight-medium);
    margin-bottom: var(--space-6);
  }
  .hero-editorial__bio {
    font-size: var(--font-size-xl);
    color: var(--color-text-secondary);
    line-height: var(--line-height-relaxed);
    max-width: 50ch;
    margin-bottom: var(--space-8);
  }
  .hero-editorial__ctas {
    display: flex;
    gap: var(--space-4);
    flex-wrap: wrap;
  }
  .hero-editorial__cta {
    display: inline-block;
    font-family: var(--font-heading);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    padding: var(--space-3) var(--space-6);
    border-radius: var(--radius-sm);
    text-decoration: none;
    transition: all var(--transition-fast);
  }
  .hero-editorial__cta--primary {
    background: var(--color-accent);
    color: var(--color-bg);
  }
  .hero-editorial__cta--primary:hover {
    background: var(--color-accent-hover);
    color: var(--color-bg);
  }
  .hero-editorial__cta--secondary {
    border: 1px solid var(--color-accent);
    color: var(--color-accent);
  }
  .hero-editorial__cta--secondary:hover {
    background: var(--color-accent-subtle);
  }
</style>

<section class="hero-editorial">
  <h1 class="hero-editorial__name">{{ .Site.Params.author }}</h1>
  <p class="hero-editorial__role">{{ .Site.Params.role }}</p>
  <p class="hero-editorial__bio">{{ .Site.Params.description }}</p>
  <div class="hero-editorial__ctas">
    <a href="/posts/" class="hero-editorial__cta hero-editorial__cta--primary">Read the Posts</a>
    <a href="/newsletter/" class="hero-editorial__cta hero-editorial__cta--secondary">Subscribe</a>
  </div>
</section>

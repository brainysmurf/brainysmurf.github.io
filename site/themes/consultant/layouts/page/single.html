{{ define "main" }}
  {{ partial "nav.html" . }}
  <main>
    <article class="page-consul container">
      <header class="page-consul__header">
        <h1 class="page-consul__title">{{ .Title }}</h1>
        <div class="page-consul__rule"></div>
      </header>

      <div class="page-consul__body prose">
        {{ .Content }}

        {{ if and (eq .Title "Newsletter") .Site.Params.beehiivUrl }}
          <div class="page-consul__embed">
            <iframe src="{{ .Site.Params.beehiivUrl }}" data-test-id="beehiiv-embed" width="100%" height="320" frameborder="0" scrolling="no" style="border-radius: var(--radius-md); background: transparent;"></iframe>
          </div>
        {{ end }}
      </div>
    </article>
  </main>

  <style>
    .page-consul {
      max-width: 800px;
      padding-top: var(--space-24);
      padding-bottom: var(--space-16);
    }

    .page-consul__header {
      margin-bottom: var(--space-12);
    }

    .page-consul__title {
      font-size: var(--font-size-4xl);
      font-weight: var(--font-weight-light);
      letter-spacing: 0.01em;
      margin-bottom: var(--space-4);
    }

    .page-consul__rule {
      width: 40px;
      height: 2px;
      background: var(--color-accent);
    }

    .page-consul__body {
      font-size: var(--font-size-lg);
      line-height: var(--line-height-relaxed);
    }

    .page-consul__body h2 {
      margin-top: var(--space-12);
      margin-bottom: var(--space-4);
    }

    .page-consul__body h3 {
      margin-top: var(--space-8);
      margin-bottom: var(--space-3);
    }

    .page-consul__embed {
      margin-top: var(--space-8);
    }

    @media (max-width: 768px) {
      .page-consul__title {
        font-size: var(--font-size-3xl);
      }
    }
  </style>
{{ end }}

{{ define "footer" }}
  {{ partial "footer.html" . }}
{{ end }}

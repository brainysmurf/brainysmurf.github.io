{{/* Nav — "Consultant" — Clean, minimal, light navigation */}}
<nav class="site-nav" id="site-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-inner container">
    <a href="/" class="nav-brand" aria-label="Home">
      {{ .Site.Title }}
    </a>

    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <div class="nav-links" id="nav-links">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}

      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</nav>

<style>
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border);
    transition: padding var(--transition-base), background var(--transition-base);
    padding: var(--space-5) 0;
  }

  [data-theme="dark"] .site-nav {
    background: rgba(17, 19, 24, 0.95);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .site-nav {
      background: rgba(17, 19, 24, 0.95);
    }
  }

  .site-nav.scrolled {
    padding: var(--space-3) 0;
    box-shadow: var(--shadow-sm);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-brand {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
    color: var(--color-text-primary);
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .nav-brand:hover {
    color: var(--color-accent);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: var(--space-8);
  }

  .nav-link {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-normal);
    color: var(--color-text-secondary);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: color var(--transition-fast);
    position: relative;
  }

  .nav-link:hover,
  .nav-link[aria-current="page"] {
    color: var(--color-accent-hover);
  }

  .nav-link[aria-current="page"]::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--color-accent);
  }

  /* ---- Theme toggle ---- */
  .theme-toggle {
    background: none;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    padding: var(--space-2);
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    line-height: 1;
    transition: color var(--transition-fast), border-color var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
  }

  .theme-toggle:hover {
    color: var(--color-accent);
    border-color: var(--color-accent);
  }

  .theme-toggle-icon::before {
    content: '\263E';
    font-size: var(--font-size-base);
  }

  [data-theme="dark"] .theme-toggle-icon::before {
    content: '\2600';
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle-icon::before {
      content: '\2600';
    }
  }

  /* ---- Mobile hamburger ---- */
  .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: var(--space-2);
  }

  .nav-toggle-bar {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--color-text-primary);
    border-radius: var(--radius-full);
    transition: transform var(--transition-fast), opacity var(--transition-fast);
  }

  .nav-toggle.active .nav-toggle-bar:nth-child(1) {
    transform: translateY(6.5px) rotate(45deg);
  }

  .nav-toggle.active .nav-toggle-bar:nth-child(2) {
    opacity: 0;
  }

  .nav-toggle.active .nav-toggle-bar:nth-child(3) {
    transform: translateY(-6.5px) rotate(-45deg);
  }

  @media (max-width: 768px) {
    .nav-toggle {
      display: flex;
    }

    .nav-links {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-bg);
      flex-direction: column;
      justify-content: center;
      gap: var(--space-8);
      transform: translateX(100%);
      transition: transform var(--transition-base);
      z-index: 999;
    }

    .nav-links.open {
      transform: translateX(0);
    }

    .nav-link {
      font-size: var(--font-size-xl);
    }
  }
</style>

<script>
  (function() {
    /* Mobile toggle */
    var toggle = document.getElementById('nav-toggle');
    var links = document.getElementById('nav-links');
    if (toggle && links) {
      toggle.addEventListener('click', function() {
        var isOpen = links.classList.toggle('open');
        toggle.classList.toggle('active');
        toggle.setAttribute('aria-expanded', isOpen);
      });
    }

    /* Dark/light mode toggle */
    var themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function() {
        var html = document.documentElement;
        var current = html.getAttribute('data-theme');
        var next;
        if (current === 'dark') {
          next = 'light';
        } else if (current === 'light') {
          next = 'dark';
        } else {
          next = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
        }
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }

    /* Sticky shrink on scroll */
    var nav = document.getElementById('site-nav');
    if (nav) {
      window.addEventListener('scroll', function() {
        if (window.scrollY > 50) {
          nav.classList.add('scrolled');
        } else {
          nav.classList.remove('scrolled');
        }
      }, { passive: true });
    }

    /* Fade-in on scroll */
    document.addEventListener('DOMContentLoaded', function() {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.15 });

      document.querySelectorAll('.fade-in').forEach(function(el) {
        observer.observe(el);
      });
    });
  })();
</script>

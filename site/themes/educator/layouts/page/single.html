{{ define "main" }}
  {{ partial "nav.html" . }}
  <article style="max-width: var(--max-width-prose); margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-16);">
    <h1 style="font-family: var(--font-heading); font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-8); letter-spacing: -0.02em;">{{ .Title }}</h1>
    <div class="single-educator__content" style="line-height: var(--line-height-relaxed);">
      {{ .Content }}
      {{ if eq .Title "Newsletter" }}
        {{ with .Site.Params.beehiivUrl }}
          <div style="margin-top: var(--space-8);">
            <iframe src="{{ . }}" width="100%" height="320" frameborder="0" scrolling="no" style="border-radius: var(--radius-lg);"></iframe>
          </div>
        {{ end }}
      {{ end }}
    </div>
  </article>
{{ end }}

{{ define "footer" }}
  {{ partial "footer.html" . }}
{{ end }}

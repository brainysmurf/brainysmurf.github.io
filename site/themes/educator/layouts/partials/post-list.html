<style>
  .postlist-educator {
    max-width: var(--max-width-site);
    margin: 0 auto;
    padding: var(--space-10) var(--space-6) var(--space-16);
  }
  .postlist-educator__heading {
    font-family: var(--font-heading);
    font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    margin-bottom: var(--space-8);
    letter-spacing: -0.02em;
  }
  .postlist-educator__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: var(--space-6);
  }
  .postitem-educator {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    color: inherit;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .postitem-educator:hover {
    color: inherit;
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .postitem-educator__image {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .postitem-educator__image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform var(--transition-base);
  }
  .postitem-educator:hover .postitem-educator__image img {
    transform: scale(1.03);
  }
  .postitem-educator__body {
    padding: var(--space-6);
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .postitem-educator__meta {
    font-size: var(--font-size-xs);
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-3);
  }
  .postitem-educator__title {
    font-family: var(--font-heading);
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
    margin-bottom: var(--space-3);
    color: var(--color-text-primary);
    transition: color var(--transition-fast);
    letter-spacing: -0.01em;
  }
  .postitem-educator:hover .postitem-educator__title {
    color: var(--color-accent);
  }
  .postitem-educator__desc {
    font-size: var(--font-size-sm);
    color: var(--color-text-secondary);
    line-height: var(--line-height-normal);
    flex: 1;
  }
  .postitem-educator__tags {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-4);
    flex-wrap: wrap;
  }
  .postitem-educator__tag {
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    color: var(--color-accent);
    background: var(--color-accent-subtle);
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-full);
  }
  @media (max-width: 768px) {
    .postlist-educator__grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="postlist-educator">
  <h2 class="postlist-educator__heading">Latest Posts</h2>
  <div class="postlist-educator__grid">
    {{ range . }}
      <a href="{{ .Permalink }}" class="postitem-educator">
        {{ with .Params.image }}
          <div class="postitem-educator__image">
            <img src="{{ . }}" alt="" loading="lazy">
          </div>
        {{ end }}
        <div class="postitem-educator__body">
          <div class="postitem-educator__meta">
            <time>{{ .Date.Format "Jan 2, 2006" }}</time>
            {{ with .Params.readTime }}<span> · {{ . }}</span>{{ end }}
          </div>
          <h3 class="postitem-educator__title">{{ .Title }}</h3>
          {{ with .Description }}
            <p class="postitem-educator__desc">{{ . }}</p>
          {{ end }}
          {{ with .Params.tags }}
            <div class="postitem-educator__tags">
              {{ range . }}<span class="postitem-educator__tag">{{ . }}</span>{{ end }}
            </div>
          {{ end }}
        </div>
      </a>
    {{ end }}
  </div>
</div>

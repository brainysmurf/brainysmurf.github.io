<style>
  .footer-educator {
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
  }
  .footer-educator__inner {
    max-width: var(--max-width-site);
    margin: 0 auto;
    padding: var(--space-10) var(--space-6) var(--space-8);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-8);
  }
  .footer-educator__left {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .footer-educator__brand {
    font-family: var(--font-heading);
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    letter-spacing: -0.02em;
  }
  .footer-educator__tagline {
    font-size: var(--font-size-sm);
    color: var(--color-text-secondary);
    line-height: var(--line-height-normal);
  }
  .footer-educator__copyright {
    font-size: var(--font-size-xs);
    color: var(--color-text-muted);
    margin-top: var(--space-4);
  }
  .footer-educator__right {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    align-items: flex-end;
  }
  .footer-educator__links {
    display: flex;
    gap: var(--space-4);
    list-style: none;
  }
  .footer-educator__links a {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text-secondary);
    text-decoration: none;
    transition: color var(--transition-fast);
  }
  .footer-educator__links a:hover { color: var(--color-accent); }
  .footer-educator__social a {
    font-size: var(--font-size-sm);
    color: var(--color-accent);
    text-decoration: none;
    font-weight: var(--font-weight-medium);
    transition: color var(--transition-fast);
  }
  .footer-educator__social a:hover { color: var(--color-accent-hover); }
  @media (max-width: 768px) {
    .footer-educator__inner {
      grid-template-columns: 1fr;
    }
    .footer-educator__right { align-items: flex-start; }
  }
</style>

<footer class="footer-educator">
  <div class="footer-educator__inner">
    <div class="footer-educator__left">
      <span class="footer-educator__brand">{{ .Site.Params.author }}</span>
      <span class="footer-educator__tagline">Writing about what happens when code meets classrooms.</span>
      <span class="footer-educator__copyright">© {{ now.Year }} {{ .Site.Params.author }}</span>
    </div>
    <div class="footer-educator__right">
      <ul class="footer-educator__links">
        <li><a href="/posts/">Posts</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/newsletter/">Newsletter</a></li>
      </ul>
      <div class="footer-educator__social">
        {{ with .Site.Params.linkedin }}<a href="{{ . }}" target="_blank" rel="noopener">LinkedIn →</a>{{ end }}
      </div>
    </div>
  </div>
</footer>

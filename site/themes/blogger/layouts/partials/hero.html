<style>
  .hero-blogger {
    max-width: var(--max-width-site);
    margin: 0 auto;
    padding: var(--space-12) var(--space-6) var(--space-10);
  }
  .hero-blogger__inner {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: var(--space-10) var(--space-8);
    box-shadow: var(--shadow-md);
    border-left: 5px solid var(--color-accent);
  }
  .hero-blogger__name {
    font-family: var(--font-heading);
    font-size: var(--font-size-3xl);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
    color: var(--color-text-primary);
    margin-bottom: var(--space-2);
  }
  .hero-blogger__role {
    font-size: var(--font-size-base);
    color: var(--color-accent);
    font-weight: var(--font-weight-medium);
    margin-bottom: var(--space-6);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .hero-blogger__bio {
    font-size: var(--font-size-lg);
    color: var(--color-text-secondary);
    line-height: var(--line-height-relaxed);
    max-width: 50ch;
    margin-bottom: var(--space-8);
  }
  .hero-blogger__ctas {
    display: flex;
    gap: var(--space-4);
    flex-wrap: wrap;
  }
  .hero-blogger__cta {
    display: inline-block;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    padding: var(--space-3) var(--space-6);
    border-radius: var(--radius-sm);
    text-decoration: none;
    transition: all var(--transition-fast);
  }
  .hero-blogger__cta--primary {
    background: var(--color-accent);
    color: #fff;
  }
  .hero-blogger__cta--primary:hover {
    background: var(--color-accent-hover);
    color: #fff;
  }
  .hero-blogger__cta--secondary {
    border: 1px solid var(--color-accent);
    color: var(--color-accent);
  }
  .hero-blogger__cta--secondary:hover {
    background: var(--color-accent-subtle);
  }
  @media (max-width: 768px) {
    .hero-blogger__inner { padding: var(--space-6); }
    .hero-blogger__name { font-size: var(--font-size-2xl); }
  }
</style>

<section class="hero-blogger">
  <div class="hero-blogger__inner">
    <h1 class="hero-blogger__name">{{ .Site.Params.author }}</h1>
    <p class="hero-blogger__role">{{ .Site.Params.role }}</p>
    <p class="hero-blogger__bio">{{ .Site.Params.description }}</p>
    <div class="hero-blogger__ctas">
      <a href="/posts/" class="hero-blogger__cta hero-blogger__cta--primary">Read the Blog</a>
      <a href="/newsletter/" class="hero-blogger__cta hero-blogger__cta--secondary">Subscribe</a>
    </div>
  </div>
</section>

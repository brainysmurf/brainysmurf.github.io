<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { display:flex; align-items:center; justify-content:center; height:100%; overflow:hidden; }
canvas {
  display:block; width:100%; border-radius:8px;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var theme = new URLSearchParams(window.location.search).get('theme') || 'dark';
  var isLight = theme === 'light';

  var C = document.getElementById('c'), ctx = C.getContext('2d');
  var W = 340, H = 210;              // low-res buffer; CSS scales it 2x to 680x420
  C.width = W; C.height = H;
  ctx.imageSmoothingEnabled = false;

  // ── Helpers ──────────────────────────────────────────────────────────
  function px(x,y,w,h,col){ ctx.fillStyle = col; ctx.fillRect(x|0, y|0, w|0, h|0); }
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function eout(x){ return 1-Math.pow(1-x,3); }
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
  function h2(v){ v = clamp(Math.round(v),0,255).toString(16); return v.length<2 ? '0'+v : v; }
  function mix(c1,c2,t){
    var a=hex(c1), b=hex(c2);
    return '#'+h2(lerp(a[0],b[0],t))+h2(lerp(a[1],b[1],t))+h2(lerp(a[2],b[2],t));
  }

  // ── Palette ──────────────────────────────────────────────────────────
  var P = isLight ? {
    wallHi:'#dfe4ee', wallLo:'#c6cedd', floor:'#9aa6bb', skirt:'#8a97ae',
    shelf:'#8b98ae', boxDim:'#aab4c6', boxEdge:'#7b89a1',
    cloud:'#eef1f7', cloudTop:'#ffffff', cloudEdge:'#b3bccd',
    deskTop:'#8d9bb2', deskLeg:'#6f7d95',
    body:'#46577a', bodyDark:'#36455f',
    mon:'#41506e', monEdge:'#2f3c55',
    screen:'#1c2b44', pane:'#25375420', paneEdge:'#3d5175',
    dim:'#67799b', accent:'#d99a2b', hot:'#f2c563', rim:'#b59a66',
    glow:'rgba(217,154,43,0.09)', steam:'rgba(255,255,255,0.5)'
  } : {
    wallHi:'#22405f', wallLo:'#16293f', floor:'#0e1b2c', skirt:'#0a1522',
    shelf:'#2b4b70', boxDim:'#1b3350', boxEdge:'#31547d',
    cloud:'#2b4b70', cloudTop:'#3d6694', cloudEdge:'#122437',
    deskTop:'#2b4b70', deskLeg:'#1b3350',
    body:'#101f33', bodyDark:'#060e18',
    mon:'#152740', monEdge:'#0a1522',
    screen:'#0b1930', pane:'#122744', paneEdge:'#1f3f66',
    dim:'#6f8fb5', accent:'#e8c860', hot:'#f7e6ae', rim:'#6d6444',
    glow:'rgba(232,200,96,0.10)', steam:'rgba(210,228,250,0.35)'
  };
  P.dim = isLight ? '#67799b' : '#6f8fb5';
  P.rimSoft = mix(P.body, P.rim, 0.45);
  P.mug = '#14181f';
  P.mugRim = mix(P.mug, isLight ? '#ffffff' : P.rim, 0.55);
  document.body.style.background = isLight ? '#eef1f6' : '#1E3A5F';

  // ── Layout ───────────────────────────────────────────────────────────
  var FLOOR = 178;
  var WIN = { x:262, y:32, w:62, h:56 };
  var DESK = { x:36, y:146, w:270, h:5 };
  var MON  = { x:124, y:58, w:132, h:80 };
  var SCR  = { x:128, y:62, w:124, h:60 };
  var CLOUD = { x:5, y:4, w:116, h:78 };
  // the classic thought bubble: eight fat lobes around the rim, small fills inside
  var PUFFS = [ {x:66,y:26,r:18}, {x:41,y:31,r:17}, {x:91,y:32,r:16},
                {x:103,y:45,r:14}, {x:88,y:57,r:16}, {x:62,y:60,r:16},
                {x:39,y:57,r:16}, {x:23,y:45,r:14},
                {x:64,y:43,r:15}, {x:46,y:43,r:13}, {x:82,y:43,r:13} ];
  var KEY = { x:104, y:141, w:46, h:5 };
  var MUG = { x:162, y:139 };

  // ── What's in the cloud: everything already finished ─────────────────
  var slots = [];
  var ROWS = [ { y:33, n:4, x:41 }, { y:42, n:5, x:35 }, { y:51, n:4, x:41 } ];
  for (var r=0;r<ROWS.length;r++){
    for (var i=0;i<ROWS[r].n;i++){
      slots.push({ x: ROWS[r].x + i*11, y: ROWS[r].y, w:8, h:5, lit: Math.random()*0.35 });
    }
  }

  // ── Four agents, running all day ─────────────────────────────────────
  var PANE = [];
  for (var j=0;j<4;j++){
    PANE.push({
      x: SCR.x + 2 + (j%2)*62, y: SCR.y + 2 + ((j/2)|0)*30, w:59, h:27,
      lines: [], t: rnd(0,3), dur: rnd(7,15), state:'run', flash:0, recalled:0, seed: j*13.7
    });
  }
  var cards = [];                    // finished work flying to the shelf
  var recallT = 22;                  // ... and occasionally coming back off it

  function newTask(p, recalled){
    p.state='run'; p.t=0; p.dur=rnd(7,15); p.lines=[]; p.recalled = recalled?1:0;
  }

  // ── Day cycle: four days per loop ────────────────────────────────────
  var DAY = 24, LOOP = DAY*4;
  var SKY = [
    { at:0.00, top:'#2b3f6b', bot:'#8a6f88' },   // dawn
    { at:0.22, top:'#4a7db5', bot:'#a8cbe4' },   // morning
    { at:0.50, top:'#4a7db5', bot:'#9dc4e0' },   // afternoon
    { at:0.70, top:'#39548a', bot:'#b87a5e' },   // dusk
    { at:0.86, top:'#121f36', bot:'#243f68' },   // night
    { at:1.00, top:'#2b3f6b', bot:'#8a6f88' }
  ];
  function skyAt(f){
    for (var i=0;i<SKY.length-1;i++){
      if (f >= SKY[i].at && f <= SKY[i+1].at){
        var t = (f-SKY[i].at)/(SKY[i+1].at-SKY[i].at);
        return { top: mix(SKY[i].top, SKY[i+1].top, t), bot: mix(SKY[i].bot, SKY[i+1].bot, t),
                 night: clamp((f-0.68)/0.18,0,1) * (1-clamp((f-0.94)/0.06,0,1)) };
      }
    }
    return { top:SKY[0].top, bot:SKY[0].bot, night:0 };
  }

  // ── The cloud itself, baked once ─────────────────────────────────────
  var cloudCv = document.createElement('canvas');
  cloudCv.width = W; cloudCv.height = H;
  function field(x,y){
    var f = 0;
    for (var i=0;i<PUFFS.length;i++){
      var d = PUFFS[i], dx = x-d.x, dy = y-d.y, d2 = dx*dx + dy*dy;
      var q = (d.r*d.r) / (d2 < 0.5 ? 0.5 : d2);
      f += q*q*q;
    }
    return f;
  }

  (function bakeCloud(){
    var c = cloudCv.getContext('2d');
    c.imageSmoothingEnabled = false;
    // coverage over a 4x4 subgrid, so the contour steps softly instead of jagging
    function cover(x,y){
      var n = 0;
      for (var sy=0; sy<4; sy++) for (var sx=0; sx<4; sx++)
        if (field(x + (sx+0.5)/4, y + (sy+0.5)/4) >= 1) n++;
      return n/16;
    }
    for (var y=CLOUD.y; y<CLOUD.y+CLOUD.h; y++){
      for (var x=CLOUD.x; x<CLOUD.x+CLOUD.w; x++){
        var a = cover(x,y);
        if (a < 0.06) continue;
        var col = P.cloud;
        if (field(x+0.5, y-1.5) < 1)      col = P.cloudTop;
        else if (field(x+0.5, y+2.5) < 1) col = P.cloudEdge;
        c.globalAlpha = a; c.fillStyle = col; c.fillRect(x,y,1,1);
      }
    }
    c.globalAlpha = 1;
  })();

  // ── Room ─────────────────────────────────────────────────────────────
  function drawRoom(sky){
    for (var y=0;y<FLOOR;y++) px(0,y,W,1, mix(P.wallHi,P.wallLo, y/FLOOR));
    px(0,FLOOR,W,H-FLOOR,P.floor);
    px(0,FLOOR-2,W,2,P.skirt);

    // window onto the day
    px(WIN.x-3, WIN.y-3, WIN.w+6, WIN.h+6, P.monEdge);
    for (var y=0;y<WIN.h;y++) px(WIN.x, WIN.y+y, WIN.w, 1, mix(sky.top, sky.bot, y/WIN.h));
    if (sky.night > 0.25){
      var sr = 9973;
      for (var i=0;i<14;i++){
        sr = (sr*1103515245+12345) & 0x7fffffff;
        var sx = WIN.x + (sr % WIN.w), sy = WIN.y + ((sr>>8) % (WIN.h-18));
        ctx.globalAlpha = (sky.night-0.25)*1.2*(0.4+0.6*Math.abs(Math.sin(i+now*0.7)));
        px(sx, sy, 1, 1, '#dce8fa');
      }
      ctx.globalAlpha = 1;
    }
    px(WIN.x+(WIN.w>>1)-1, WIN.y, 2, WIN.h, P.monEdge);
    px(WIN.x, WIN.y+(WIN.h>>1)-1, WIN.w, 2, P.monEdge);

    ctx.drawImage(cloudCv, 0, 0);

    // desk
    px(DESK.x, DESK.y, DESK.w, DESK.h, P.deskTop);
    px(DESK.x, DESK.y+DESK.h, DESK.w, 1, P.monEdge);
    px(DESK.x+10, DESK.y+DESK.h, 5, FLOOR-DESK.y-DESK.h, P.deskLeg);
    px(DESK.x+DESK.w-15, DESK.y+DESK.h, 5, FLOOR-DESK.y-DESK.h, P.deskLeg);
  }

  function drawMemories(){
    for (var i=0;i<slots.length;i++){
      var s = slots[i];
      px(s.x, s.y, s.w, s.h, P.boxDim);
      px(s.x, s.y, s.w, 1, P.boxEdge);
      var a = clamp(s.lit,0,1);
      if (a > 0.02){
        ctx.globalAlpha = a;
        px(s.x+1, s.y+2, s.w-2, 2, P.accent);
        px(s.x+1, s.y+2, s.w-3, 1, P.hot);
        ctx.globalAlpha = a*0.5; ctx.fillStyle = P.glow;
        ctx.fillRect(s.x-2, s.y-2, s.w+4, s.h+4);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ── The thought: head to cloud, and brighter when something is recalled
  var TRAIL = [ {x:78, y:101, r:2}, {x:73, y:93, r:3}, {x:67, y:84, r:4} ];
  var thoughtFlash = 0;
  function blob(cx, cy, r, col){
    for (var y=-r; y<=r; y++){
      var dx = Math.floor(Math.sqrt(r*r - y*y));
      px(cx-dx, cy+y, dx*2+1, 1, col);
    }
  }
  function drawThought(t){
    for (var i=0;i<TRAIL.length;i++){
      var b = TRAIL[i];
      var ph = (((t*0.4 - i*0.16) % 1) + 1) % 1;
      var pulse = Math.pow(Math.max(0, Math.sin(ph*Math.PI)), 2.2);
      ctx.globalAlpha = clamp(0.12 + 0.58*pulse + thoughtFlash*0.35, 0, 1);
      blob(b.x, b.y + Math.round(Math.sin(t*1.1 + i)), b.r, thoughtFlash > 0.3 ? P.hot : P.cloudTop);
    }
    ctx.globalAlpha = 1;
  }

  // ── The person ───────────────────────────────────────────────────────
  // ── The person: seated, rim-lit, typing all day ──────────────────────
  function limb(x1,y1,x2,y2,w,col){
    var n = Math.max(Math.abs(x2-x1), Math.abs(y2-y1), 1);
    for (var s=0;s<=n;s++) px(lerp(x1,x2,s/n), lerp(y1,y2,s/n), w, w, col);
  }

  function drawPerson(t, busy){
    var bob  = Math.sin(t*0.9)*0.8;
    var hx   = 78;
    var ty   = 124 + bob;                       // shoulder line
    var hy   = 105 + bob;                       // top of the head

    // chair: back and lumbar, behind the torso
    px(hx-14, 117,  7, 41, P.bodyDark);
    px(hx-12, 128,  4, 22, P.body);
    // chair: seat, gas column, star base, castors
    px(hx-13, 155, 31,  4, P.bodyDark);
    px(hx+1,  159,  4, 13, P.bodyDark);
    px(hx-10, 172, 26,  2, P.bodyDark);
    px(hx-11, 174,  4,  4, P.bodyDark);
    px(hx+13, 174,  4,  4, P.bodyDark);

    // far leg, then near leg: thighs under the desk, feet on the floor
    px(hx-13, 153, 26,  6, P.bodyDark);
    px(hx+6,  158,  6, 16, P.bodyDark);
    px(hx+4,  174, 12,  4, P.bodyDark);
    px(hx-12, 151, 32,  7, P.body);
    px(hx+13, 158,  8, 16, P.body);
    px(hx+11, 174, 14,  4, P.body);
    // contours, so the leg doesn't read as one slab
    px(hx-12, 151, 32,  1, P.rimSoft);          // top of the thigh
    px(hx+13, 157,  8,  1, P.rimSoft);          // knee
    px(hx+20, 159,  1, 15, P.rim);              // shin, facing the screen
    px(hx+11, 174, 14,  1, P.rimSoft);          // top of the foot
    px(hx+24, 175,  1,  3, P.rim);

    // torso, neck, head
    px(hx-6, ty+6, 20, 26, P.body);
    px(hx-4, ty,   19, 10, P.body);
    px(hx+4, ty-7,  6,  8, P.body);
    px(hx+1, hy+3, 15, 10, P.body);
    px(hx+2, hy,   13, 13, P.body);
    px(hx+1, hy-2, 14,  5, P.bodyDark);
    px(hx,   hy+2,  4,  8, P.bodyDark);
    // screenlight down the face and the front of the shoulder
    px(hx+15, hy+1,  1, 11, P.rim);
    px(hx+14, ty+1,  1, 10, P.rim);

    // the arm: elbow tucked in, hand working the keyboard
    var typ   = busy ? 19 : 10;
    var hxp   = 106 + Math.sin(t*0.37)*7;                 // drifts along the keys
    var lift  = Math.sin(t*0.5) > 0.86 ? 3 : 0;           // occasional pause
    var tapA  = !lift && Math.sin(t*typ)      > 0.15;
    var tapB  = !lift && Math.sin(t*typ*0.73) > 0.35;
    var hyp   = 136 - lift + ((tapA||tapB) ? 1 : 0);

    limb(hx+12, ty+4,  hx+10, ty+15, 5, P.body);          // upper arm
    limb(hx+10, ty+15, hxp,   hyp+1, 4, P.body);          // forearm
    px(hxp,   hyp,   7, 4, P.body);                       // hand
    px(hxp+2, hyp-1, 4, 1, P.rim);                        // light across the knuckles
    px(hxp+1, hyp+4, 2, 2, tapA ? P.rim : P.body);        // fingers on the keys
    px(hxp+4, hyp+4, 2, 2, tapB ? P.rim : P.body);
  }

  function drawMug(t){
    px(MUG.x, MUG.y, 7, 7, P.mug);
    px(MUG.x+7, MUG.y+2, 2, 3, P.mug);
    px(MUG.x, MUG.y, 7, 1, P.mugRim);
    px(MUG.x+6, MUG.y+1, 1, 6, P.mugRim);
    for (var i=0;i<3;i++){
      var ph = t*1.3 + i*1.7, rise = (ph % 3)/3;
      ctx.globalAlpha = (1-rise)*0.35;
      px(MUG.x+2+Math.round(Math.sin(ph*2)*2), MUG.y-2-rise*12, 1, 2, P.steam);
    }
    ctx.globalAlpha = 1;
  }

  function drawGlow(night){
    ctx.fillStyle = P.glow;
    var layers = 8;
    for (var g=layers-1; g>=0; g--){
      ctx.globalAlpha = (0.20 + night*0.30) * (1 - g/layers);
      ctx.fillRect(SCR.x-4-g*5, SCR.y-3-g*4, SCR.w+8+g*10, SCR.h+6+g*8);
    }
    ctx.globalAlpha = 1;
  }

  // ── Monitor + agent panes ────────────────────────────────────────────
  function drawMonitor(t){
    px(MON.x, MON.y, MON.w, MON.h, P.mon);
    px(MON.x, MON.y, MON.w, 1, P.monEdge);
    px(MON.x+(MON.w>>1)-5, MON.y+MON.h, 10, 6, P.mon);   // stand
    px(MON.x+(MON.w>>1)-14, MON.y+MON.h+6, 28, 2, P.monEdge);
    px(SCR.x, SCR.y, SCR.w, SCR.h, P.screen);

    for (var i=0;i<PANE.length;i++){
      var p = PANE[i];
      px(p.x, p.y, p.w, p.h, P.pane);
      px(p.x, p.y, p.w, 3, P.paneEdge);
      // title bar dot: gold while running, hot on the frame it lands
      ctx.globalAlpha = p.state==='run' ? 0.55+0.45*Math.abs(Math.sin(t*4+p.seed)) : 1;
      px(p.x+2, p.y+1, 2, 1, p.recalled ? P.hot : P.accent);
      ctx.globalAlpha = 1;

      for (var l=0;l<p.lines.length;l++){
        var ln = p.lines[l];
        ctx.globalAlpha = ln.a;
        px(p.x+2+ln.ind, p.y+5+l*3, ln.w, 1, ln.hot ? P.accent : P.dim);
        ctx.globalAlpha = 1;
      }

      // progress along the bottom of the pane
      var prog = clamp(p.t/p.dur,0,1);
      px(p.x+2, p.y+p.h-3, p.w-4, 1, P.paneEdge);
      px(p.x+2, p.y+p.h-3, Math.round((p.w-4)*prog), 1, P.accent);

      if (p.flash > 0){
        ctx.globalAlpha = p.flash*0.9;
        ctx.fillStyle = P.hot; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.globalAlpha = 1;
        px(p.x+p.w-9, p.y+p.h-8, 2, 2, P.hot);      // tick
        px(p.x+p.w-7, p.y+p.h-6, 2, 2, P.hot);
        px(p.x+p.w-5, p.y+p.h-10, 2, 2, P.hot);
      }
    }

  }

  // ── Loop ─────────────────────────────────────────────────────────────
  var now = 0, last = 0, busy = 0;
  function step(ts){
    now = ts/1000;
    var dt = last ? Math.min(0.05, now-last) : 0.016; last = now;
    var sky = skyAt((now % DAY)/DAY);

    // agents tick over
    busy = Math.max(0, busy-dt);
    for (var i=0;i<PANE.length;i++){
      var p = PANE[i];
      if (p.state==='run'){
        p.t += dt;
        if (Math.random() < dt*7){
          p.lines.push({ w: 6+Math.random()*34|0, ind: Math.random()*8|0, a: 0.75, hot: Math.random()<0.18 });
          if (p.lines.length > 6) p.lines.shift();
          for (var l=0;l<p.lines.length;l++) p.lines[l].a = 0.3 + 0.5*(l/Math.max(1,p.lines.length-1));
        }
        if (p.t >= p.dur){ p.state='done'; p.flash=1; }
      } else {
        p.flash -= dt*1.6;
        if (p.flash <= 0.55 && !p.sent){
          p.sent = true;
          var free = slots[(Math.random()*slots.length)|0];
          cards.push({ x:p.x+p.w/2, y:p.y+p.h/2, sx:p.x+p.w/2, sy:p.y+p.h/2,
                       tx:free.x+free.w/2, ty:free.y+free.h/2, t:0, slot:free, back:false });
        }
        if (p.flash <= 0){ p.sent=false; newTask(p,false); busy = 0.5; }
      }
    }

    // something months old, needed again
    recallT -= dt;
    if (recallT <= 0){
      recallT = rnd(20,34);
      thoughtFlash = 1;
      var s = slots[(Math.random()*slots.length)|0];
      var tgt = PANE[(Math.random()*PANE.length)|0];
      cards.push({ x:s.x+s.w/2, y:s.y+s.h/2, sx:s.x+s.w/2, sy:s.y+s.h/2,
                   tx:tgt.x+tgt.w/2, ty:tgt.y+tgt.h/2, t:0, slot:s, back:true, pane:tgt });
    }

    // the cloud forgets at its own pace
    for (i=0;i<slots.length;i++) slots[i].lit = Math.max(0, slots[i].lit - dt*0.055);
    thoughtFlash = Math.max(0, thoughtFlash - dt*0.55);

    ctx.clearRect(0,0,W,H);
    drawRoom(sky);
    if (sky.night > 0){
      ctx.globalAlpha = sky.night * (isLight ? 0.46 : 0.34);
      ctx.fillStyle = '#060e18'; ctx.fillRect(0,0,W,FLOOR+(H-FLOOR));
      ctx.globalAlpha = 1;
    }
    drawMemories();
    drawThought(now);
    drawGlow(sky.night);
    drawMonitor(now);
    drawPerson(now, busy>0);
    px(DESK.x, DESK.y, DESK.w, DESK.h, P.deskTop);
    px(DESK.x, DESK.y+DESK.h, DESK.w, 1, P.monEdge);
    drawMug(now);
    px(KEY.x, KEY.y, KEY.w, KEY.h, P.deskLeg);
    px(KEY.x, KEY.y, KEY.w, 1, P.monEdge);

    // work in flight
    for (i=cards.length-1;i>=0;i--){
      var c = cards[i];
      c.t += dt/1.2;
      if (c.t >= 1){
        if (c.back){ c.slot.lit = Math.max(c.slot.lit, 0.25); newTask(c.pane, true); busy = 0.5; }
        else { c.slot.lit = 1; }
        cards.splice(i,1); continue;
      }
      var e = eout(c.t);
      var cx = lerp(c.sx, c.tx, e), cy = lerp(c.sy, c.ty, e) - Math.sin(c.t*Math.PI)*26;
      ctx.globalAlpha = 0.35 + 0.65*Math.sin(c.t*Math.PI);
      px(cx-2, cy-2, 5, 4, c.back ? P.hot : P.accent);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

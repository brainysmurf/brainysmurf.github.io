<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { display:flex; align-items:center; justify-content:center; height:100%; overflow:hidden; }
canvas { display:block; width:100%; border-radius:8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var theme = new URLSearchParams(window.location.search).get('theme') || 'dark';
  var isLight = theme === 'light';
  document.body.style.background = isLight ? '#f0f2f8' : '#264a73';

  var C = document.getElementById('c'), ctx = C.getContext('2d');
  C.width = 600; C.height = 360;
  var W = C.width, H = C.height;

  // Window layout
  var WX = 55, WY = 32, WW = 490, WH = 298;
  var TITLE_H = 30;
  var PAD = 22;
  var LABEL_W = 88;
  var BAR_H = 20;
  var BAR_R = 10;
  var ROW_H = 44;
  var ROW_TOP = WY + TITLE_H + PAD;

  var WIN_BG    = isLight ? '#ffffff'               : '#1c2138';
  var WIN_TITLE = isLight ? '#e9ecf5'               : '#242a44';
  var TITLE_TXT = isLight ? 'rgba(40,45,70,0.50)'   : 'rgba(210,225,255,0.50)';
  var LABEL_CLR = isLight ? 'rgba(40,45,70,0.65)'   : 'rgba(210,225,255,0.60)';
  var TRACK_CLR = isLight ? 'rgba(0,0,0,0.07)'      : 'rgba(255,255,255,0.07)';
  var PCT_CLR   = isLight ? 'rgba(40,45,70,0.42)'   : 'rgba(210,225,255,0.40)';

  var LABELS = ['New unit plan', 'Student podcast', 'Maker project', 'Class museum', 'Portfolio show'];

  // Easing
  function ease(x){ return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2,2)/2; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // Bar fill progression: fast→50%, medium→75%, slow→90%
  var F1 = 0.26, F2 = 0.68, F3 = 1.20;
  function barFill(e){
    if (e <= 0) return 0;
    if (e < F1) return 0.50 * ease(e / F1);
    if (e < F2) return 0.50 + 0.25 * ease((e-F1) / (F2-F1));
    if (e < F3) return 0.75 + 0.15 * ease((e-F2) / (F3-F2));
    return 0.90;
  }

  // Each bar spawns when the previous hits 75% (at e=F2)
  var STAGGER = F2; // 0.68s
  var STARTS  = [0, STAGGER, STAGGER*2, STAGGER*3, STAGGER*4];

  // Bar 4 hits 90% at STARTS[4]+F3 = 2.72+1.20 = 3.92
  var DONE_T  = STARTS[4] + F3;   // 3.92
  var SWELL_DUR = 0.55;
  var HOLD    = 1.10;
  var TOTAL   = DONE_T + SWELL_DUR + HOLD; // ~5.57

  var t = 0, lastTs = null;

  // Rounded rect path on ctx
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  function drawWindow(){
    // Shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.38)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 9;
    rr(WX,WY,WW,WH,10);
    ctx.fillStyle = WIN_BG;
    ctx.fill();
    ctx.restore();

    // Title bar (rounded top only)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(WX+10,WY); ctx.lineTo(WX+WW-10,WY);
    ctx.arcTo(WX+WW,WY, WX+WW,WY+10, 10);
    ctx.lineTo(WX+WW, WY+TITLE_H);
    ctx.lineTo(WX, WY+TITLE_H);
    ctx.lineTo(WX, WY+10);
    ctx.arcTo(WX,WY, WX+10,WY, 10);
    ctx.closePath();
    ctx.fillStyle = WIN_TITLE;
    ctx.fill();
    ctx.restore();

    // Traffic lights
    var cy = WY + TITLE_H/2;
    [[WX+14,'#ff5f57'],[WX+32,'#febc2e'],[WX+50,'#28c840']].forEach(function(d){
      ctx.beginPath(); ctx.arc(d[0],cy,5,0,Math.PI*2);
      ctx.fillStyle = d[1]; ctx.fill();
    });

    // Window title text
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = TITLE_TXT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Active Projects', WX+WW/2, WY+TITLE_H/2);
    ctx.textAlign = 'left';

    // Body fill (below title bar — cover any artefact)
    ctx.fillStyle = WIN_BG;
    ctx.fillRect(WX, WY+TITLE_H, WW, WH-TITLE_H);

    // Redraw rounded bottom over the rect fill
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(WX, WY+TITLE_H);
    ctx.lineTo(WX+WW, WY+TITLE_H);
    ctx.lineTo(WX+WW, WY+WH-10);
    ctx.arcTo(WX+WW, WY+WH, WX+WW-10, WY+WH, 10);
    ctx.lineTo(WX+10, WY+WH);
    ctx.arcTo(WX, WY+WH, WX, WY+WH-10, 10);
    ctx.closePath();
    ctx.fillStyle = WIN_BG;
    ctx.fill();
    ctx.restore();
  }

  function drawBar(i, fill, slideIn, swellProg){
    if (slideIn <= 0) return;

    var baseY = ROW_TOP + i * ROW_H;
    var slideOffset = ease(clamp(1-slideIn,0,1)) * 52;
    var alpha = clamp(slideIn * 2.5, 0, 1);

    ctx.save();
    ctx.globalAlpha = alpha;

    var y = baseY + slideOffset;

    // Track geometry
    var trackX = WX + PAD + LABEL_W + 8;
    var pctX   = WX + WW - PAD;
    var trackW = pctX - trackX - 38;

    // Label
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = LABEL_CLR;
    ctx.textBaseline = 'middle';
    ctx.fillText(LABELS[i], WX+PAD, y+BAR_H/2);

    // Track background
    rr(trackX, y, trackW, BAR_H, BAR_R);
    ctx.fillStyle = TRACK_CLR;
    ctx.fill();

    if (fill > 0.005){
      var fw = Math.max(BAR_R*2, trackW * fill);

      ctx.save();
      // Clip fill to track shape
      rr(trackX, y, trackW, BAR_H, BAR_R);
      ctx.clip();

      // Main fill
      var g = ctx.createLinearGradient(0, y, 0, y+BAR_H);
      g.addColorStop(0, '#5ea8ff');
      g.addColorStop(0.5, '#4287f5');
      g.addColorStop(1, '#2f6ee0');
      ctx.fillStyle = g;
      ctx.fillRect(trackX, y, fw, BAR_H);

      // Sheen highlight
      var sh = ctx.createLinearGradient(0, y, 0, y+BAR_H);
      sh.addColorStop(0,   'rgba(255,255,255,0.24)');
      sh.addColorStop(0.5, 'rgba(255,255,255,0.04)');
      sh.addColorStop(1,   'rgba(255,255,255,0.00)');
      ctx.fillStyle = sh;
      ctx.fillRect(trackX, y, fw, BAR_H);

      // Swell effect at the right edge
      if (swellProg > 0){
        var ex = trackX + fw;
        var dw = 32 + swellProg * 14;

        // Deepening shadow gradient pressing in from right
        var deep = ctx.createLinearGradient(ex-dw, 0, ex, 0);
        deep.addColorStop(0, 'rgba(15,35,120,0)');
        deep.addColorStop(1, 'rgba(15,35,120,' + (0.72 * swellProg) + ')');
        ctx.fillStyle = deep;
        ctx.fillRect(ex-dw, y, dw, BAR_H);

        // Glowing edge stripe
        ctx.shadowColor = '#a8c8ff';
        ctx.shadowBlur  = 5 + swellProg * 18;
        ctx.fillStyle   = 'rgba(160,200,255,' + (0.35 + 0.65*swellProg) + ')';
        ctx.fillRect(ex-2, y, 3, BAR_H);
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }

    // Percentage
    ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = PCT_CLR;
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(fill * 100) + '%', pctX, y + BAR_H/2);
    ctx.textAlign = 'left';

    ctx.restore();
  }

  function frame(ts){
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts-lastTs)/1000, 0.05);
    lastTs = ts;
    t = (t + dt) % TOTAL;

    // Canvas background
    ctx.fillStyle = isLight ? '#f0f2f8' : '#264a73';
    ctx.fillRect(0, 0, W, H);

    drawWindow();

    // Clip bars to window content area so slide-in is masked at window edge
    ctx.save();
    ctx.beginPath();
    ctx.rect(WX+1, WY+TITLE_H+1, WW-2, WH-TITLE_H-2);
    ctx.clip();

    for (var i = 0; i < 5; i++){
      var elapsed = t - STARTS[i];
      var fill    = barFill(elapsed);
      var slideIn = elapsed < 0 ? 0 : clamp(elapsed / 0.32, 0, 1);

      // Each bar pulses at its right edge once it hits 90%
      var sw = 0;
      var hitTime = STARTS[i] + F3;
      if (t >= hitTime){
        var st = (t - hitTime) / SWELL_DUR;
        var fadeIn = Math.min(1, st * 2.2);
        sw = fadeIn * (Math.sin(st * Math.PI * 2.4) * 0.38 + 0.62);
      }
      drawBar(i, fill, slideIn, sw);
    }

    ctx.restore();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
